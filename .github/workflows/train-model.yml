name: Train SWIN AI

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Количество эпох для учебной RNN"
        required: true
        default: "30"
  push:
    branches: ["main"]
    paths:
      - "server/model.py"
      - "server/train.py"
      - "server/data/train.txt"
      - "server/requirements.txt"
      - ".github/workflows/train-model.yml"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r server/requirements-transformer.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Train own model weights
        working-directory: server
        run: python train.py --data data/train.txt --epochs ${{ inputs.epochs || '30' }} --output model.npz
      - uses: actions/upload-artifact@v4
        with:
          name: swin-ai-model
          path: server/model.npz
          if-no-files-found: error
