name: Train SWIN AI
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Количество эпох"
        required: true
        default: "30"
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r server/requirements.txt
      - name: Train model
        working-directory: server
        run: python train.py --data data/train.txt --epochs ${{ inputs.epochs }} --output model.npz
      - uses: actions/upload-artifact@v4
        with:
          name: swin-ai-model
          path: server/model.npz
