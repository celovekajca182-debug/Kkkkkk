name: Build LAST ZONE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prepare bundled game files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest icon.svg sw.js www/
          mkdir -p www/vendor
          cp node_modules/three/build/three.module.js www/vendor/three.module.js
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./vendor/three.module.js#' www/index.html

      - name: Validate game JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Game module script not found")
          Path("/tmp/last-zone-game.mjs").write_text(match.group(1))
          PY
          node --check /tmp/last-zone-game.mjs

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Set landscape and fullscreen display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:screenOrientation="landscape"')
          p.write_text(s)
          styles = Path("android/app/src/main/res/values/styles.xml")
          if styles.exists():
              t = styles.read_text()
              t = t.replace('</style>', '<item name="android:windowFullscreen">true</item></style>', 1)
              styles.write_text(t)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle build failed (attempt $attempt/3); clearing incomplete distribution and retrying in 15 seconds..."
              rm -rf "$HOME/.gradle/wrapper/dists/gradle-8.2.1-all"
              sleep 15
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-ZONE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
