name: Train SWIN Transformer

on:
  workflow_dispatch:
    inputs:
      pretrain_epochs:
        description: "Эпохи предобучения на русских текстах"
        required: true
        default: "12"
      sft_epochs:
        description: "Эпохи дообучения на вопросах и ответах"
        required: true
        default: "6"
  push:
    branches: ["main"]
    paths:
      - "server/transformer.py"
      - "server/train_transformer.py"
      - "server/evaluate_transformer.py"
      - "server/prepare_corpus.py"
      - "server/prepare_coding_data.py"
      - "server/data/train.txt"
      - "server/data/knowledge.json"
      - "server/data/dialogue.jsonl"
      - "server/data/coding_dialogue.jsonl"
      - "server/requirements-transformer.txt"
      - "tests/test_transformer.py"
      - "tests/test_evaluate_transformer.py"
      - "tests/test_prepare_corpus.py"
      - "tests/test_training_corpus.py"
      - "tests/test_prepare_coding_data.py"
      - ".github/workflows/train-transformer.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: server
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r server/requirements-transformer.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install datasets==3.3.2
      - name: Prepare capped open Russian datasets
        working-directory: server
        run: |
          python prepare_corpus.py \
            --web-documents 2500 \
            --web-max-chars 1500000 \
            --max-doc-chars 2500 \
            --oasst-max-pairs 3500
          python prepare_coding_data.py --max-train 700 --max-validation 160
      - name: Run all tests
        run: python -m unittest discover -s tests -v
      - name: Two-stage SWIN training
        working-directory: server
        run: |
          python train_transformer.py \
            --pretrain-epochs ${{ inputs.pretrain_epochs || '12' }} \
            --sft-epochs ${{ inputs.sft_epochs || '6' }} \
            --block-size 512 \
            --batch-size 12 \
            --d-model 128 \
            --heads 4 \
            --layers 4 \
            --output models/swin-transformer.pt \
            --pretrain-output models/swin-transformer-pretrain.pt
      - name: Evaluate generated Russian answers and Python code
        working-directory: server
        run: |
          python evaluate_transformer.py \
            --checkpoint models/swin-transformer.pt \
            --json-output models/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: swin-ai-transformer-weights
          path: |
            server/models/swin-transformer.pt
            server/models/swin-transformer-pretrain.pt
            server/data/dataset_manifest.json
            server/data/mbpp_manifest.json
          if-no-files-found: error

      - name: Publish SWIN model checkpoint
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swin-model-latest
          name: SWIN AI model checkpoint
          target_commitish: ${{ github.sha }}
          files: |
            server/models/swin-transformer.pt
          overwrite_files: true
          make_latest: false
