name: Train SWIN Transformer

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/train-transformer.yml"
  workflow_dispatch:
    inputs:
      pretrain_epochs:
        description: "Эпохи многоязычного предобучения"
        required: true
        default: "12"
      sft_epochs:
        description: "Эпохи многоязычного instruction tuning"
        required: true
        default: "6"
permissions:
  contents: write

concurrency:
  group: swin-transformer-training
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: server
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt
          pip install -r server/requirements-transformer.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install datasets==3.3.2
      - name: Prepare capped multilingual open datasets
        # Ten OASST1 response languages plus seven capped FineWeb2-HQ language subsets.
        working-directory: server
        run: |
          python prepare_corpus.py \
            --web-documents 2500 \
            --web-max-chars 1500000 \
            --wiki-documents 1500 \
            --wiki-max-chars 900000 \
            --classic-documents 400 \
            --classic-max-chars 250000 \
            --multilingual-web-languages "deu_Latn,spa_Latn,fra_Latn,cmn_Hani,ita_Latn,por_Latn,jpn_Jpan" \
            --multilingual-web-documents 300 \
            --multilingual-web-max-chars 100000 \
            --max-doc-chars 2500 \
            --oasst-max-pairs 3500
          python prepare_coding_data.py --max-train 700 --max-validation 160
      - name: Run all tests
        working-directory: server
        run: python -m unittest discover -s ../tests -v
      # Rebuild this checkpoint from the current multilingual code, tokenizer and datasets.
      - name: Two-stage SWIN training
        working-directory: server
        run: |
          python train_transformer.py \
            --pretrain-epochs ${{ inputs.pretrain_epochs || '12' }} \
            --sft-epochs ${{ inputs.sft_epochs || '6' }} \
            --block-size 512 \
            --batch-size 12 \
            --d-model 128 \
            --heads 4 \
            --layers 4 \
            --vocab-size 2048 \
            --output models/swin-transformer.pt \
            --pretrain-output models/swin-transformer-pretrain.pt
      - name: Evaluate all ten chat languages and Python code
        working-directory: server
        run: |
          python evaluate_transformer.py \
            --checkpoint models/swin-transformer.pt \
            --json-output models/evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: swin-ai-transformer-weights
          path: |
            server/models/swin-transformer.pt
            server/models/swin-transformer-pretrain.pt
            server/models/evaluation.json
            server/data/finewiki_ru_train.txt
            server/data/dataset_manifest.json
            server/data/mbpp_manifest.json
            server/data/DATASET_SOURCES.md
          if-no-files-found: error

      - name: Verify this is the latest training revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale checkpoint release: $GITHUB_SHA != $latest_sha"
          fi

      - name: Publish SWIN model checkpoint
        if: steps.revision.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swin-model-latest
          name: SWIN AI model checkpoint
          target_commitish: ${{ github.sha }}
          files: |
            server/models/swin-transformer.pt
          overwrite_files: true
          make_latest: false
