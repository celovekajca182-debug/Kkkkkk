name: Publish SWIN PEFT GPU container

on:
  workflow_dispatch:
  push:
    branches:
      - swin-adapter-inference
    paths:
      - "server/peft_inference_server.py"
      - "server/peft-inference.Dockerfile"
      - "server/inference-requirements.txt"
      - ".github/workflows/publish-swin-peft-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        shell: bash
        run: |
          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$OWNER/swin-peft-coder" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish GPU inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/peft-inference.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
