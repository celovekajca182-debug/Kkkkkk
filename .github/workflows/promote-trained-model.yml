name: Promote SWIN checkpoint

on:
  workflow_run:
    workflows: ["Train SWIN Transformer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify training inputs have not changed
        env:
          TRAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          changed_paths="$(git diff --name-only "$TRAIN_SHA" origin/main)"
          echo "Changes after the training revision:"
          printf '%s\n' "$changed_paths"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              README.md|docs/*|server/data/DATASET_SOURCES.md|.github/workflows/promote-trained-model.yml)
                ;;
              *)
                echo "Training inputs or code changed after this run: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_paths"

      - name: Download checkpoint artifact from the completed training run
        uses: actions/download-artifact@v4
        with:
          name: swin-ai-transformer-weights
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifact

      - name: Validate checkpoint, evaluation and dataset manifest
        id: verify
        run: |
          CHECKPOINT="$(find artifact -type f -name 'swin-transformer.pt' -print -quit)"
          EVALUATION="$(find artifact -type f -name 'evaluation.json' -print -quit)"
          MANIFEST="$(find artifact -type f -name 'dataset_manifest.json' -print -quit)"
          test -n "$CHECKPOINT"
          test -n "$EVALUATION"
          test -n "$MANIFEST"
          test -s "$CHECKPOINT"
          python - "$EVALUATION" "$MANIFEST" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          assert report.get("accepted") is True, "Evaluation gate did not accept the checkpoint"
          assert manifest.get("finewiki", {}).get("train_documents", 0) > 0, "FineWiki training data is missing"
          assert manifest.get("fineweb2_hq", {}).get("train_documents", 0) > 0, "FineWeb2 training data is missing"
          assert manifest.get("openassistant", {}).get("train_pairs", 0) > 0, "OASST instruction data is missing"
          print("Validated accepted checkpoint and all three training sources.")
          PY
          echo "checkpoint=$CHECKPOINT" >> "$GITHUB_OUTPUT"

      - name: Publish the evaluated SWIN checkpoint
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swin-model-latest
          name: SWIN AI model checkpoint
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            SWIN AI checkpoint trained from the current main revision.

            Sources: Russian FineWeb2-HQ, Russian FineWiki / Wikipedia, OpenAssistant OASST1, local project examples and MBPP Python tasks.

            The evaluation report and dataset manifest are available in the originating Train SWIN Transformer workflow artifact. FineWiki source attribution and licenses are documented in server/data/DATASET_SOURCES.md.
          files: ${{ steps.verify.outputs.checkpoint }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
