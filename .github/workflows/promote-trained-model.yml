name: Promote SWIN checkpoint

on:
  workflow_run:
    workflows: ["Train SWIN Transformer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify training inputs have not changed
        env:
          TRAIN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin main
          changed_paths="$(git diff --name-only "$TRAIN_SHA" origin/main)"
          echo "Changes after the training revision:"
          printf '%s\n' "$changed_paths"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              README.md|docs/*|server/data/DATASET_SOURCES.md|server/app.py|server/coding_agent.py|server/transformer.py|server/evaluate_transformer.py|tests/*|android/**|.github/workflows/android-apk.yml|.github/workflows/promote-trained-model.yml)
                ;;
              *)
                echo "Training inputs or code changed after this run: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_paths"

      - name: Download checkpoint artifact from the completed training run
        uses: actions/download-artifact@v4
        with:
          name: swin-ai-transformer-weights
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: artifact

      - name: Validate checkpoint and dataset manifests
        id: verify
        run: |
          CHECKPOINT="$(find artifact -type f -name 'swin-transformer.pt' -print -quit)"
          EVALUATION="$(find artifact -type f -name 'evaluation.json' -print -quit)"
          MANIFEST="$(find artifact -type f -name 'dataset_manifest.json' -print -quit)"
          MBPP_MANIFEST="$(find artifact -type f -name 'mbpp_manifest.json' -print -quit)"
          test -n "$CHECKPOINT"
          test -n "$EVALUATION"
          test -n "$MANIFEST"
          test -n "$MBPP_MANIFEST"
          test -s "$CHECKPOINT"
          python - "$EVALUATION" "$MANIFEST" "$MBPP_MANIFEST" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          manifest = json.load(open(sys.argv[2], encoding="utf-8"))
          mbpp = json.load(open(sys.argv[3], encoding="utf-8"))
          assert isinstance(report, dict), "Training evaluation report is invalid"
          assert report.get("accepted") is True, "Multilingual quality gate did not accept the checkpoint"
          assert report.get("total_text_probes") == 11, "Expected all 11 multilingual text probes"
          assert report.get("python_code_probe_passed") is True, "Python code probe did not pass"
          assert manifest.get("finewiki", {}).get("train_documents", 0) > 0, "FineWiki training data is missing"
          assert manifest.get("fineweb2_hq", {}).get("train_documents", 0) > 0, "Russian FineWeb2 training data is missing"
          assert manifest.get("ru_classic", {}).get("train_documents", 0) > 0, "ru-classic training data is missing"
          multilingual_web = manifest.get("fineweb2_multilingual", {}).get("languages", {})
          required_web_languages = ("de", "es", "fr", "zh", "it", "pt", "ja")
          missing_web = [lang for lang in required_web_languages if multilingual_web.get(lang, {}).get("train_documents", 0) <= 0]
          assert not missing_web, "Missing multilingual FineWeb2 training data: " + ", ".join(missing_web)
          openassistant = manifest.get("openassistant", {})
          required_chat_languages = ("ru", "en", "de", "es", "fr", "zh", "uk", "pt", "it", "ja")
          language_pairs = openassistant.get("train_pairs_by_language", {})
          missing_chat = [lang for lang in required_chat_languages if language_pairs.get(lang, 0) <= 0]
          assert not missing_chat, "Missing OASST1 language pairs: " + ", ".join(missing_chat)
          assert openassistant.get("train_pairs", 0) > 0, "OpenAssistant training data is missing"
          assert mbpp.get("train_examples", 0) > 0, "MBPP code-training data is missing"
          print("Validated the ten OASST1 languages, seven additional FineWeb2 languages and the multilingual quality gate.")
          PY
          echo "checkpoint=$CHECKPOINT" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install current checkpoint evaluator dependencies
        run: |
          pip install -r server/requirements-transformer.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Re-run the current quality gate on the candidate checkpoint
        run: |
          python server/evaluate_transformer.py \
            --checkpoint "${{ steps.verify.outputs.checkpoint }}" \
            --json-output artifact/evaluation-current.json

      - name: Publish the evaluated SWIN checkpoint
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swin-model-latest
          name: SWIN AI model checkpoint
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            SWIN AI checkpoint trained from the current main revision.

            Sources: Russian + seven additional FineWeb2-HQ languages, Russian FineWiki / Wikipedia, ten OASST1 chat languages, local project examples and MBPP Python tasks.

            The candidate was re-evaluated with the current main-branch quality gate before promotion. Original and current evaluation reports, plus dataset manifests, are available in the originating workflow artifact or promotion logs. FineWiki source attribution and licenses are documented in server/data/DATASET_SOURCES.md.
          files: ${{ steps.verify.outputs.checkpoint }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
