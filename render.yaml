services:
  - type: web
    name: swin-ai-api
    runtime: python
    rootDir: server
    buildCommand: mkdir -p models && curl -fL --retry 3 https://github.com/celovekajca182-debug/Kkkkkk/releases/download/swin-model-latest/swin-transformer.pt -o models/swin-transformer.pt && pip install -r requirements-transformer.txt --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
